# Drugi program w paczce: agent kopii zapasowej uruchamiany z konsoli (photon-backup.exe).
# Bez JavaFX, z małą stertą i oddawaniem nieużywanej pamięci systemowi.
main-class=com.photon.backup.BackupAgent
win-console=true
java-options=-Xms16m -Xmx512m -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -XX:TieredStopAtLevel=1 -Xss512k -Dfile.encoding=UTF-8
